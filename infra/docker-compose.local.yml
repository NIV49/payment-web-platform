name: payment-web-platform-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-web-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_platform
      POSTGRES_USER: payment_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
      - ../backend/modules/identity/persistence-postgres/src/main/resources/db/migration/V1__permission_schema.sql:/docker-entrypoint-initdb.d/001_permission_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_dev -d payment_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  payment_postgres_data:
    name: payment-web-platform-postgres-data
