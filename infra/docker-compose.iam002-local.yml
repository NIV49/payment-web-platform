name: payment-web-platform-iam002-local

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: payment_platform
      POSTGRES_USER: payment_dev
      POSTGRES_PASSWORD: ${PAYMENT_IAM002_POSTGRES_PASSWORD:?missing PostgreSQL password}
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_dev -d payment_platform"]
      interval: 3s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:7.2.13-alpine@sha256:ac32d5e70f29e2be83384f5173180911b666c79a0e91ac0d074de5771638ed91
    environment:
      VALKEY_PASSWORD: ${PAYMENT_IAM002_REDIS_PASSWORD:?missing Valkey password}
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$VALKEY_PASSWORD\""]
    ports:
      - "127.0.0.1:26379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    command: ["start-dev", "--features=recovery-codes", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?missing Keycloak admin username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?missing Keycloak admin password}
      KC_HEALTH_ENABLED: "true"
      PAYMENT_KEYCLOAK_SMTP_HOST: host.docker.internal
      PAYMENT_KEYCLOAK_SMTP_PORT: "11025"
      PAYMENT_KEYCLOAK_SMTP_FROM: ${PAYMENT_KEYCLOAK_SMTP_FROM}
      PAYMENT_PLATFORM_OIDC_CLIENT_SECRET: ${PAYMENT_PLATFORM_OIDC_CLIENT_SECRET}
      PAYMENT_PLATFORM_KEYCLOAK_ADMIN_CLIENT_SECRET: ${PAYMENT_PLATFORM_KEYCLOAK_ADMIN_CLIENT_SECRET}
      PAYMENT_PLATFORM_LOCAL_ADMIN_PASSWORD: ${PAYMENT_PLATFORM_LOCAL_ADMIN_PASSWORD}
      PAYMENT_PLATFORM_LOCAL_ADMIN_TOTP_SECRET: ${PAYMENT_PLATFORM_LOCAL_ADMIN_TOTP_SECRET}
      PAYMENT_PLATFORM_OIDC_REDIRECT_URI: http://platform.localhost:15999/api/auth/oidc/callback
      PAYMENT_PLATFORM_OIDC_BACKCHANNEL_LOGOUT_URI: http://host.docker.internal:18081/api/auth/oidc/backchannel-logout
      PAYMENT_PLATFORM_OIDC_POST_LOGOUT_REDIRECT_URI: http://platform.localhost:15999/auth/login
      PAYMENT_PLATFORM_WEB_ORIGIN: http://platform.localhost:15999
      PAYMENT_MERCHANT_OIDC_CLIENT_SECRET: ${PAYMENT_MERCHANT_OIDC_CLIENT_SECRET}
      PAYMENT_MERCHANT_KEYCLOAK_ADMIN_CLIENT_SECRET: ${PAYMENT_MERCHANT_KEYCLOAK_ADMIN_CLIENT_SECRET}
      PAYMENT_MERCHANT_LOCAL_ADMIN_PASSWORD: ${PAYMENT_MERCHANT_LOCAL_ADMIN_PASSWORD}
      PAYMENT_MERCHANT_LOCAL_ADMIN_TOTP_SECRET: ${PAYMENT_MERCHANT_LOCAL_ADMIN_TOTP_SECRET}
      PAYMENT_MERCHANT_OIDC_REDIRECT_URI: http://merchant-e2e.localhost:16002/api/auth/oidc/callback
      PAYMENT_MERCHANT_OIDC_BACKCHANNEL_LOGOUT_URI: http://host.docker.internal:18082/api/auth/oidc/backchannel-logout
      PAYMENT_MERCHANT_OIDC_POST_LOGOUT_REDIRECT_URI: http://merchant-e2e.localhost:16002/auth/login
      PAYMENT_MERCHANT_WEB_ORIGIN: http://merchant-e2e.localhost:16002
      PAYMENT_AGENT_OIDC_CLIENT_SECRET: ${PAYMENT_AGENT_OIDC_CLIENT_SECRET}
      PAYMENT_AGENT_KEYCLOAK_ADMIN_CLIENT_SECRET: ${PAYMENT_AGENT_KEYCLOAK_ADMIN_CLIENT_SECRET}
      PAYMENT_AGENT_LOCAL_ADMIN_PASSWORD: ${PAYMENT_AGENT_LOCAL_ADMIN_PASSWORD}
      PAYMENT_AGENT_LOCAL_ADMIN_TOTP_SECRET: ${PAYMENT_AGENT_LOCAL_ADMIN_TOTP_SECRET}
      PAYMENT_AGENT_OIDC_REDIRECT_URI: http://agent.localhost:16001/api/auth/oidc/callback
      PAYMENT_AGENT_OIDC_BACKCHANNEL_LOGOUT_URI: http://host.docker.internal:18083/api/auth/oidc/backchannel-logout
      PAYMENT_AGENT_OIDC_POST_LOGOUT_REDIRECT_URI: http://agent.localhost:16001/auth/login
      PAYMENT_AGENT_WEB_ORIGIN: http://agent.localhost:16001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - "${PAYMENT_IAM002_REALM_DIR:?missing Realm directory}:/opt/keycloak/data/import:ro"
      - keycloak_data:/opt/keycloak/data
volumes:
  postgres_data:
    name: payment-web-platform-iam002-postgres-data
  valkey_data:
    name: payment-web-platform-iam002-valkey-data
  keycloak_data:
    name: payment-web-platform-iam002-keycloak-data
