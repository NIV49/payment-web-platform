server:
  address: 127.0.0.1
  port: 18082

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:25432/payment_platform
    username: payment_dev
    password: ${PAYMENT_IAM002_POSTGRES_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: 26379
      password: ${PAYMENT_IAM002_REDIS_PASSWORD}

payment:
  permissions:
    legacy-administration-cutover-complete: true
  security:
    allowed-origin: http://merchant-e2e.localhost:16002
  identity:
    local-login-enabled: false
    lifecycle:
      enabled: true
      admin-client-id: merchant-identity-lifecycle
  oidc:
    enabled: true
    issuer: http://127.0.0.1:18080/realms/MERCHANT
    authorization-uri: http://127.0.0.1:18080/realms/MERCHANT/protocol/openid-connect/auth
    token-uri: http://127.0.0.1:18080/realms/MERCHANT/protocol/openid-connect/token
    jwk-set-uri: http://127.0.0.1:18080/realms/MERCHANT/protocol/openid-connect/certs
    end-session-uri: http://127.0.0.1:18080/realms/MERCHANT/protocol/openid-connect/logout
    client-id: merchant-admin-api
    redirect-uri: http://merchant-e2e.localhost:16002/api/auth/oidc/callback
    post-logout-redirect-uri: http://merchant-e2e.localhost:16002/auth/login
    public-scheme: http
    public-port: 16002

sa-token:
  cookie:
    secure: false
