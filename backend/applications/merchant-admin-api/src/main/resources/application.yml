server:
  address: ${PAYMENT_MERCHANT_BIND_ADDRESS:127.0.0.1}
  port: ${PAYMENT_MERCHANT_PORT:8082}
  forward-headers-strategy: NONE

spring:
  application:
    name: payment-merchant-admin-api
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
  data:
    redis:
      host: ${PAYMENT_REDIS_HOST}
      port: ${PAYMENT_REDIS_PORT}
      password: ${PAYMENT_REDIS_PASSWORD}
  flyway:
    enabled: ${PAYMENT_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    postgresql:
      transactional-lock: false
  jooq:
    sql-dialect: POSTGRES
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

sa-token:
  token-name: PAYMENT_MERCHANT_SESSION
  timeout: 28800
  active-timeout: 1800
  is-concurrent: false
  is-share: false
  is-read-cookie: true
  is-read-header: false
  is-read-body: false
  is-write-header: false
  is-lasting-cookie: true
  right-now-create-token-session: true
  cookie:
    http-only: true
    secure: ${PAYMENT_COOKIE_SECURE:true}
    same-site: Strict
    path: /

payment:
  identity:
    login-type: merchant-admin
    local-login-enabled: false
    lifecycle:
      enabled: ${PAYMENT_MERCHANT_IDENTITY_LIFECYCLE_ENABLED:false}
      admin-client-id: ${PAYMENT_MERCHANT_KEYCLOAK_ADMIN_CLIENT_ID:}
      poll-delay: PT5S
      lease-duration: PT30S
      retry-delay: PT15S
  oidc:
    enabled: ${PAYMENT_MERCHANT_OIDC_ENABLED:false}
    issuer: ${PAYMENT_MERCHANT_OIDC_ISSUER}
    authorization-uri: ${PAYMENT_MERCHANT_OIDC_AUTHORIZATION_URI}
    token-uri: ${PAYMENT_MERCHANT_OIDC_TOKEN_URI}
    jwk-set-uri: ${PAYMENT_MERCHANT_OIDC_JWK_SET_URI}
    end-session-uri: ${PAYMENT_MERCHANT_OIDC_END_SESSION_URI}
    client-id: ${PAYMENT_MERCHANT_OIDC_CLIENT_ID}
    redirect-uri: ${PAYMENT_MERCHANT_OIDC_REDIRECT_URI}
    post-logout-redirect-uri: ${PAYMENT_MERCHANT_OIDC_POST_LOGOUT_REDIRECT_URI}
    required-acr: ${PAYMENT_MERCHANT_OIDC_REQUIRED_ACR:2}
    public-scheme: ${PAYMENT_MERCHANT_PUBLIC_SCHEME:https}
    frontend-callback-path: /auth/oidc/callback
    transaction-ttl: PT5M
    handoff-ttl: PT1M
    application-session-index-ttl: PT9H
    logout-event-maximum-age: PT5M
    logout-processing-ttl: PT30S
    logout-replay-ttl: PT24H
  security:
    allowed-origin: ${PAYMENT_MERCHANT_ALLOWED_ORIGIN:http://127.0.0.1:6002}
    max-request-body-bytes: 262144
  menu:
    allowed-page-components: /dashboard/workspace/index
