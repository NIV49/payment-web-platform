server:
  address: ${PAYMENT_PLATFORM_BIND_ADDRESS:127.0.0.1}

spring:
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://127.0.0.1:15432/payment_platform}
    username: ${PAYMENT_DB_USERNAME:payment_dev}
    password: ${PAYMENT_DB_PASSWORD:disabled}
  data:
    redis:
      host: ${PAYMENT_REDIS_HOST:127.0.0.1}
      port: ${PAYMENT_REDIS_PORT:16379}
      password: ${PAYMENT_REDIS_PASSWORD:disabled}
  flyway:
    enabled: ${PAYMENT_FLYWAY_ENABLED:true}

payment:
  time-zone: ${PAYMENT_TIME_ZONE:Asia/Shanghai}
  permissions:
    legacy-administration-cutover-complete: ${PAYMENT_LEGACY_ADMINISTRATION_CUTOVER_COMPLETE:true}
  # Public local fixture only. The initializer bean does not exist outside this profile.
  bootstrap-password: ${PAYMENT_BOOTSTRAP_PASSWORD}
  security:
    allowed-origins: ${PAYMENT_PLATFORM_ALLOWED_ORIGIN:http://127.0.0.1:5999}

sa-token:
  cookie:
    secure: ${PAYMENT_COOKIE_SECURE:false}
