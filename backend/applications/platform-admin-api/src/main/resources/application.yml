server:
  address: ${PAYMENT_PLATFORM_BIND_ADDRESS}
  port: ${PAYMENT_PLATFORM_PORT:8080}
  # Forwarded/X-Forwarded-* values are untrusted unless a boundary proxy strips
  # client-supplied headers first. Keep them disabled by default so login
  # throttling cannot be bypassed by spoofing the apparent client address.
  forward-headers-strategy: ${PAYMENT_FORWARD_HEADERS_STRATEGY:NONE}

spring:
  application:
    name: payment-platform-admin-api
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
  data:
    redis:
      host: ${PAYMENT_REDIS_HOST}
      port: ${PAYMENT_REDIS_PORT}
      password: ${PAYMENT_REDIS_PASSWORD}
  flyway:
    enabled: ${PAYMENT_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    postgresql:
      transactional-lock: false
  jooq:
    sql-dialect: POSTGRES
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

# Sa-Token's auto-configuration binds this bean while the application context
# is created, before the web server accepts traffic. Security settings must not
# be deferred to an ApplicationRunner.
sa-token:
  token-name: PAYMENT_PLATFORM_SESSION
  timeout: 28800
  active-timeout: 1800
  is-concurrent: false
  is-share: false
  is-read-cookie: true
  is-read-header: false
  is-read-body: false
  is-write-header: false
  is-lasting-cookie: true
  right-now-create-token-session: true
  cookie:
    http-only: true
    secure: ${PAYMENT_COOKIE_SECURE:true}
    same-site: Strict
    path: /

payment:
  time-zone: ${PAYMENT_TIME_ZONE:UTC}
  permissions:
    # Keep disabled while any N-1 client depends on legacy menu:manage or department:manage grants.
    legacy-administration-cutover-complete: ${PAYMENT_LEGACY_ADMINISTRATION_CUTOVER_COMPLETE:false}
  menu:
    # Keep in sync with deliberate route pages under platform-admin/src/views.
    allowed-page-components: /dashboard/analytics/index,/dashboard/workspace/index,/demos/antd/index,/system/dept/list,/system/menu/list,/system/role/list,/system/user/list
  security:
    allowed-origins: ${PAYMENT_PLATFORM_ALLOWED_ORIGIN:http://127.0.0.1:5999}
    # Applies to every mutating /api request, including chunked requests without Content-Length.
    max-request-body-bytes: ${PAYMENT_MAX_REQUEST_BODY_BYTES:262144}
  identity:
    account-domain: PLATFORM
    login-type: platform-admin
    local-login-enabled: false
  oidc:
    enabled: ${PAYMENT_PLATFORM_OIDC_ENABLED:false}
    issuer: ${PAYMENT_PLATFORM_OIDC_ISSUER:}
    authorization-uri: ${PAYMENT_PLATFORM_OIDC_AUTHORIZATION_URI:}
    token-uri: ${PAYMENT_PLATFORM_OIDC_TOKEN_URI:}
    jwk-set-uri: ${PAYMENT_PLATFORM_OIDC_JWK_SET_URI:}
    end-session-uri: ${PAYMENT_PLATFORM_OIDC_END_SESSION_URI:}
    client-id: ${PAYMENT_PLATFORM_OIDC_CLIENT_ID:}
    redirect-uri: ${PAYMENT_PLATFORM_OIDC_REDIRECT_URI:}
    post-logout-redirect-uri: ${PAYMENT_PLATFORM_OIDC_POST_LOGOUT_REDIRECT_URI:}
    required-acr: ${PAYMENT_PLATFORM_OIDC_REQUIRED_ACR:2}
    public-scheme: ${PAYMENT_PLATFORM_PUBLIC_SCHEME:https}
    frontend-callback-path: /auth/oidc/callback
    transaction-ttl: PT5M
    handoff-ttl: PT1M
    application-session-index-ttl: PT9H
    logout-event-maximum-age: PT5M
    logout-processing-ttl: PT30S
    logout-replay-ttl: PT24H

logging:
  level:
    root: INFO
    com.niv.payment: INFO
