server:
  address: ${PAYMENT_ADMIN_BIND_ADDRESS:127.0.0.1}

spring:
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://127.0.0.1:15432/payment_platform}
    username: ${PAYMENT_DB_USERNAME:payment_dev}
    password: ${PAYMENT_DB_PASSWORD:payment_dev}
  data:
    redis:
      host: ${PAYMENT_REDIS_HOST:127.0.0.1}
      port: ${PAYMENT_REDIS_PORT:16379}
      password: ${PAYMENT_REDIS_PASSWORD:}
  flyway:
    enabled: ${PAYMENT_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1

payment:
  time-zone: ${PAYMENT_TIME_ZONE:Asia/Shanghai}
  # Public local fixture only. The initializer bean does not exist outside this profile.
  bootstrap-password: ${PAYMENT_BOOTSTRAP_PASSWORD:Admin@123456}
  security:
    cookie-secure: ${PAYMENT_COOKIE_SECURE:false}
    allowed-origins: ${PAYMENT_ALLOWED_ORIGINS:http://localhost:5999,http://127.0.0.1:5999}
