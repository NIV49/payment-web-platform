server:
  address: ${PAYMENT_ADMIN_BIND_ADDRESS}
  port: ${PAYMENT_ADMIN_PORT:8080}
  # Forwarded/X-Forwarded-* values are untrusted unless a boundary proxy strips
  # client-supplied headers first. Keep them disabled by default so login
  # throttling cannot be bypassed by spoofing the apparent client address.
  forward-headers-strategy: ${PAYMENT_FORWARD_HEADERS_STRATEGY:NONE}

spring:
  application:
    name: payment-admin-api
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
  data:
    redis:
      host: ${PAYMENT_REDIS_HOST}
      port: ${PAYMENT_REDIS_PORT}
      password: ${PAYMENT_REDIS_PASSWORD}
  flyway:
    enabled: ${PAYMENT_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  jooq:
    sql-dialect: POSTGRES
  jackson:
    default-property-inclusion: non_null

# Sa-Token's auto-configuration binds this bean while the application context
# is created, before the web server accepts traffic. Security settings must not
# be deferred to an ApplicationRunner.
sa-token:
  token-name: PAYMENT_SESSION
  timeout: 28800
  active-timeout: 1800
  is-concurrent: false
  is-share: false
  is-read-cookie: true
  is-read-header: false
  is-read-body: false
  is-write-header: false
  is-lasting-cookie: true
  right-now-create-token-session: true
  cookie:
    http-only: true
    secure: ${PAYMENT_COOKIE_SECURE:true}
    same-site: Strict
    path: /

payment:
  time-zone: ${PAYMENT_TIME_ZONE:UTC}
  permissions:
    # Keep disabled while any N-1 client depends on legacy menu:manage or department:manage grants.
    legacy-administration-cutover-complete: ${PAYMENT_LEGACY_ADMINISTRATION_CUTOVER_COMPLETE:false}
  menu:
    # Keep in sync with deliberate route pages under web-antdv-next/src/views.
    allowed-page-components: /dashboard/analytics/index,/dashboard/workspace/index,/demos/antd/index,/system/dept/list,/system/menu/list,/system/role/list,/system/user/list
  security:
    allowed-origins: ${PAYMENT_ALLOWED_ORIGINS}
    # Applies to every mutating /api request, including chunked requests without Content-Length.
    max-request-body-bytes: ${PAYMENT_MAX_REQUEST_BODY_BYTES:262144}

logging:
  level:
    root: INFO
    com.niv.payment: INFO
