<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">支付平台业务全景</title>
  <desc id="desc">从商户、付款人和运营入口，经订单、渠道路由、渠道执行、回调、账户账簿、结算、商户通知和对账的支付平台全景，并标明新平台 Payment 能力尚未进入实现阶段。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 500 42px 'PingFang SC','Microsoft YaHei',Arial,sans-serif; fill: #17212b; }
      .subtitle { font: 400 24px 'PingFang SC','Microsoft YaHei',Arial,sans-serif; fill: #52606d; }
      .section { font: 500 24px 'PingFang SC','Microsoft YaHei',Arial,sans-serif; fill: #17212b; }
      .node-title { font: 500 27px 'PingFang SC','Microsoft YaHei',Arial,sans-serif; fill: #17212b; text-anchor: middle; }
      .node-text { font: 400 22px 'PingFang SC','Microsoft YaHei',Arial,sans-serif; fill: #3e4c59; text-anchor: middle; }
      .tag { font: 500 20px 'PingFang SC','Microsoft YaHei',Arial,sans-serif; }
      .legend { font: 400 20px 'PingFang SC','Microsoft YaHei',Arial,sans-serif; fill: #3e4c59; }
      .edge { fill: none; stroke: #52606d; stroke-width: 3; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .edge-dashed { fill: none; stroke: #52606d; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <text class="title" x="70" y="68">支付平台业务全景</text>
  <text class="subtitle" x="70" y="108">一笔订单如何连接用户、交易、渠道、资金与运营证据</text>

  <rect x="70" y="135" width="1460" height="66" rx="6" fill="#fff3f0" stroke="#f2b8b5" stroke-width="2"/>
  <text x="100" y="177" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="500" fill="#b42318">当前边界：新平台 Payment / Account / Ledger 尚未进入实现阶段；下图业务能力来自旧系统参考，底部绿色区域是目标约束。</text>

  <text class="section" x="70" y="252">业务参与者</text>
  <rect x="70" y="278" width="220" height="108" rx="6" fill="#f3f4f6" stroke="#9aa5b1" stroke-width="2"/>
  <text class="node-title" x="180" y="323">商户系统</text>
  <text class="node-text" x="180" y="357">下单 · 查询 · 接收通知</text>
  <rect x="70" y="420" width="220" height="108" rx="6" fill="#f3f4f6" stroke="#9aa5b1" stroke-width="2"/>
  <text class="node-title" x="180" y="465">付款人 / 收款人</text>
  <text class="node-text" x="180" y="499">完成付款或接收出款</text>
  <rect x="70" y="562" width="220" height="108" rx="6" fill="#f3f4f6" stroke="#9aa5b1" stroke-width="2"/>
  <text class="node-title" x="180" y="607">运营与财务</text>
  <text class="node-text" x="180" y="641">配置 · 异常 · 对账</text>

  <text class="section" x="340" y="252">接入与交易</text>
  <rect x="340" y="278" width="245" height="108" rx="6" fill="#eaf2ff" stroke="#7aa7e8" stroke-width="2"/>
  <text class="node-title" x="462" y="323">商户 API / H5</text>
  <text class="node-text" x="462" y="357">身份 · 参数 · 幂等受理</text>
  <rect x="340" y="420" width="245" height="108" rx="6" fill="#eaf2ff" stroke="#7aa7e8" stroke-width="2"/>
  <text class="node-title" x="462" y="465">订单与状态机</text>
  <text class="node-text" x="462" y="499">代收 · 代付 · UNKNOWN</text>
  <rect x="340" y="562" width="245" height="108" rx="6" fill="#f5f3ff" stroke="#a78bdb" stroke-width="2"/>
  <text class="node-title" x="462" y="607">管理后台</text>
  <text class="node-text" x="462" y="641">只读证据与受控操作</text>

  <text class="section" x="640" y="252">决策与外部执行</text>
  <rect x="640" y="278" width="245" height="108" rx="6" fill="#e8f7f4" stroke="#55a89a" stroke-width="2"/>
  <text class="node-title" x="762" y="323">渠道路由</text>
  <text class="node-text" x="762" y="357">过滤 · 熔断 · 排序</text>
  <rect x="940" y="278" width="245" height="108" rx="6" fill="#fff5e8" stroke="#d99a45" stroke-width="2"/>
  <text class="node-title" x="1062" y="323">渠道运行时</text>
  <text class="node-text" x="1062" y="357">Adapter · 请求日志</text>
  <rect x="1240" y="278" width="290" height="108" rx="6" fill="#fff5e8" stroke="#d99a45" stroke-width="2"/>
  <text class="node-title" x="1385" y="323">银行 / 钱包 / 支付渠道</text>
  <text class="node-text" x="1385" y="357">外部受理与最终结果</text>

  <rect x="940" y="420" width="245" height="108" rx="6" fill="#f5f3ff" stroke="#a78bdb" stroke-width="2"/>
  <text class="node-title" x="1062" y="465">回调与主动查询</text>
  <text class="node-text" x="1062" y="499">验签 · 去重 · 标准化</text>

  <text class="section" x="640" y="590">资金事实与异步闭环</text>
  <rect x="640" y="620" width="245" height="118" rx="6" fill="#eaf7ed" stroke="#65a873" stroke-width="2"/>
  <text class="node-title" x="762" y="666">账户与账簿</text>
  <text class="node-text" x="762" y="701">冻结 · 入账 · 扣冻结</text>
  <rect x="940" y="620" width="245" height="118" rx="6" fill="#eaf7ed" stroke="#65a873" stroke-width="2"/>
  <text class="node-title" x="1062" y="666">结算</text>
  <text class="node-text" x="1062" y="701">待结算转可用</text>
  <rect x="1240" y="620" width="290" height="118" rx="6" fill="#f5f3ff" stroke="#a78bdb" stroke-width="2"/>
  <text class="node-title" x="1385" y="666">通知与对账</text>
  <text class="node-text" x="1385" y="701">商户通知 · 差异工单</text>

  <path class="edge" d="M290 332 H340"/>
  <path class="edge" d="M585 332 H640"/>
  <path class="edge" d="M885 332 H940"/>
  <path class="edge" d="M1185 332 H1240"/>
  <path class="edge-dashed" d="M1385 386 V474 H1185"/>
  <path class="edge-blue" d="M940 474 H585"/>
  <path class="edge" d="M462 528 V679 H640"/>
  <path class="edge" d="M885 679 H940"/>
  <path class="edge" d="M1185 679 H1240"/>
  <path class="edge-dashed" d="M1240 708 H305 V616 H290"/>
  <path class="edge" d="M290 474 H340"/>
  <path class="edge" d="M290 616 H340"/>

  <rect x="70" y="790" width="1460" height="134" rx="6" fill="#eef8f1" stroke="#65a873" stroke-width="2"/>
  <text x="100" y="830" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="500" fill="#15703b">TARGET · 目标平台资金护栏（尚未实现）</text>
  <text x="100" y="870" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#253b2f">订单最终状态 + 余额投影 + 复式账本 + Outbox 在同一本地事务提交</text>
  <text x="100" y="906" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#253b2f">外部渠道由持久事件驱动；UNKNOWN 保持安全资金状态；通知只发生在最终资金事务之后</text>

  <rect x="1170" y="56" width="18" height="18" rx="3" fill="#eaf2ff" stroke="#7aa7e8"/>
  <text class="legend" x="1198" y="72">交易能力</text>
  <rect x="1320" y="56" width="18" height="18" rx="3" fill="#eaf7ed" stroke="#65a873"/>
  <text class="legend" x="1348" y="72">资金事实</text>
  <rect x="1170" y="91" width="18" height="18" rx="3" fill="#fff5e8" stroke="#d99a45"/>
  <text class="legend" x="1198" y="107">外部渠道</text>
  <rect x="1320" y="91" width="18" height="18" rx="3" fill="#f5f3ff" stroke="#a78bdb"/>
  <text class="legend" x="1348" y="107">异步 / 运营</text>
</svg>
