name: Frontend admin verification

on:
  pull_request:
    paths:
      - "frontend/admin/**"
      - "docs/ai-context/frontend/**"
      - "docs/ai-context/vben/**"
      - "docs/ai-context/development-workflow.md"
      - ".github/workflows/frontend.yml"
      - "lefthook.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/admin/**"
      - "docs/ai-context/frontend/**"
      - "docs/ai-context/vben/**"
      - "docs/ai-context/development-workflow.md"
      - ".github/workflows/frontend.yml"
      - "lefthook.yml"

permissions:
  contents: read

concurrency:
  group: frontend-admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/admin

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/admin/.node-version
          cache: pnpm
          cache-dependency-path: frontend/admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm run lint

      - name: Type-check product application
        run: pnpm -F @vben/web-antdv-next run typecheck

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Verify production safety boundaries
        run: pnpm run test:production-safety

      - name: Build product application
        run: pnpm run build:antdv-next

      - name: Verify independent backoffice artifacts
        run: node scripts/deploy/verify-three-artifacts.mjs apps/web-antdv-next/dist
