name: Documentation verification

on:
  pull_request:
    paths:
      - "docs/**"
      - ".agents/skills/**"
      - "AGENTS.md"
      - "README.md"
      - "scripts/check-doc-decisions.py"
      - "scripts/check_project_skills.py"
      - "scripts/check_sensitive_artifacts.py"
      - "scripts/tests/**"
      - ".github/workflows/documentation.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".agents/skills/**"
      - "AGENTS.md"
      - "README.md"
      - "scripts/check-doc-decisions.py"
      - "scripts/check_project_skills.py"
      - "scripts/check_sensitive_artifacts.py"
      - "scripts/tests/**"
      - ".github/workflows/documentation.yml"

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Show Python version
        run: python3 --version

      - name: Verify AI context decision states
        run: python3 scripts/check-doc-decisions.py

      - name: Test documentation governance
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Verify project skills
        run: python3 scripts/check_project_skills.py

      - name: Scan sensitive documentation artifacts
        run: python3 scripts/check_sensitive_artifacts.py
