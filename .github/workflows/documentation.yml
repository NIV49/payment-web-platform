name: Documentation verification

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # PRs trust the protected base branch; pushes trust the previous main commit.
  TRUSTED_POLICY_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: python:3.13.14-bookworm@sha256:b4d62b6602fd5b284f82cb9b733cc550f237f847c065b84cbb54dfe28ce837a2
      options: --platform linux/amd64
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Show Python version
        run: python3 -I --version

      - name: Install pinned documentation dependencies
        run: >-
          python3 -I -m pip install --disable-pip-version-check
          --require-hashes --no-deps
          --only-binary=:all:
          -r scripts/requirements-documentation.txt

      - name: Verify AI context decision states before tests
        run: python3 -I scripts/check-doc-decisions.py

      - name: Verify project skills before tests
        run: python3 -I scripts/check_project_skills.py

      - name: Scan sensitive documentation artifacts before tests
        run: >-
          python3 -I scripts/check_sensitive_artifacts.py
          --repository-root "$GITHUB_WORKSPACE"
          --base-commit "$TRUSTED_POLICY_COMMIT"
          --commit "$GITHUB_SHA"

      - name: Verify modernization artifact contracts before tests
        run: >-
          python3 -I scripts/check_modernization_artifacts.py
          --repository-root "$GITHUB_WORKSPACE"
          --commit "$GITHUB_SHA"
          --trusted-policy-commit "$TRUSTED_POLICY_COMMIT"

      - name: Verify immutable commit before running PR-controlled tests
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD)"
          test "$checked_out_sha" = "$GITHUB_SHA"
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          GIT_NO_REPLACE_OBJECTS=1 git --no-replace-objects archive "$checked_out_sha" | tar -x -C "$snapshot"
          git -C "$snapshot" init --quiet
          git -C "$snapshot" add -f -A
          (
            cd "$snapshot"
            python3 -I scripts/check-doc-decisions.py
            python3 -I scripts/check_project_skills.py
          )
          python3 -I "$snapshot/scripts/check_sensitive_artifacts.py" \
            --repository-root "$GITHUB_WORKSPACE" \
            --base-commit "$TRUSTED_POLICY_COMMIT" \
            --commit "$checked_out_sha"
          python3 -I "$snapshot/scripts/check_modernization_artifacts.py" \
            --repository-root "$GITHUB_WORKSPACE" \
            --commit "$checked_out_sha" \
            --trusted-policy-commit "$TRUSTED_POLICY_COMMIT"
          test "$(git rev-parse --verify HEAD)" = "$checked_out_sha"
          git diff --exit-code "$checked_out_sha" --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Test documentation governance without snapshot drift
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD)"
          test "$checked_out_sha" = "$GITHUB_SHA"
          python3 -I -m unittest discover -s scripts/tests -p "test_*.py"
          test "$(git rev-parse --verify HEAD)" = "$checked_out_sha"
          git diff --exit-code "$checked_out_sha" --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
